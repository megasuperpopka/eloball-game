<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#070b14">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>ТРИ СМЕШИНКИ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --auth-bg-0: #070b14;
      --auth-bg-1: #0f1730;
      --auth-accent: #2dd4bf;
      --auth-accent-dim: rgba(45, 212, 191, 0.15);
      --auth-text: #f1f5f9;
      --auth-muted: #94a3b8;
      --auth-card: rgba(15, 23, 42, 0.65);
      --auth-border: rgba(148, 163, 184, 0.18);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--auth-bg-0);
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }

    body.auth-locked {
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #101b36;
      touch-action: none;
    }

    /* ——— Окно входа / регистрации ——— */
    .auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 24px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      background:
        radial-gradient(ellipse 120% 80% at 50% -20%, rgba(45, 212, 191, 0.12), transparent 50%),
        radial-gradient(ellipse 80% 60% at 100% 50%, rgba(99, 102, 241, 0.08), transparent 45%),
        radial-gradient(ellipse 70% 50% at 0% 80%, rgba(34, 211, 238, 0.06), transparent 40%),
        linear-gradient(165deg, var(--auth-bg-0) 0%, var(--auth-bg-1) 55%, #0a0f1a 100%);
    }

    .auth-overlay--visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .auth-shell {
      width: min(440px, 100%);
      animation: authPop 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes authPop {
      from {
        opacity: 0;
        transform: translateY(28px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .auth-card {
      border-radius: 20px;
      border: 1px solid var(--auth-border);
      background: var(--auth-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.04) inset,
        0 25px 50px -12px rgba(0, 0, 0, 0.55);
      padding: 32px 32px 28px;
      color: var(--auth-text);
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 6px;
    }

    .auth-brand h1 {
      margin: 0;
      font-size: clamp(1.15rem, 4.2vw, 1.65rem);
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(120deg, #f8fafc 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .auth-brand p {
      margin: 8px 0 0;
      font-size: 0.875rem;
      color: var(--auth-muted);
      font-weight: 500;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin: 28px 0 22px;
      padding: 4px;
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .auth-tab {
      flex: 1;
      border: none;
      border-radius: 11px;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--auth-muted);
      background: transparent;
      cursor: pointer;
      transition: color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .auth-tab:hover {
      color: #cbd5e1;
    }

    .auth-tab--active {
      color: #042f2e;
      background: linear-gradient(135deg, #5eead4 0%, #2dd4bf 50%, #14b8a6 100%);
      box-shadow: 0 4px 14px rgba(45, 212, 191, 0.35);
    }

    .auth-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .auth-panel[hidden],
    .auth-field[hidden] {
      display: none;
    }

    .auth-field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--auth-muted);
      margin-bottom: 8px;
    }

    .auth-field input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(2, 6, 23, 0.5);
      color: var(--auth-text);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      user-select: text;
      -webkit-user-select: text;
    }

    .auth-field input::placeholder {
      color: rgba(148, 163, 184, 0.5);
    }

    .auth-field input:focus {
      border-color: rgba(45, 212, 191, 0.55);
      box-shadow: 0 0 0 3px var(--auth-accent-dim);
    }

    .auth-error {
      min-height: 20px;
      margin: 0;
      font-size: 0.8125rem;
      color: #fca5a5;
      font-weight: 500;
    }

    .auth-check {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #cbd5e1;
      font-size: 0.86rem;
      user-select: none;
    }

    .auth-check input {
      width: 16px;
      height: 16px;
      accent-color: #14b8a6;
    }

    .auth-submit {
      margin-top: 6px;
      height: 50px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      color: #042f2e;
      cursor: pointer;
      background: linear-gradient(135deg, #5eead4 0%, #2dd4bf 45%, #0d9488 100%);
      box-shadow: 0 8px 24px rgba(13, 148, 136, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    .auth-submit:hover {
      filter: brightness(1.06);
      box-shadow: 0 12px 28px rgba(13, 148, 136, 0.45);
    }

    .auth-submit:active {
      transform: scale(0.98);
    }

    .auth-footnote {
      margin: 18px 0 0;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(148, 163, 184, 0.75);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="auth-overlay" class="auth-overlay" aria-hidden="true">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-brand">
          <h1>ТРИ СМЕШИНКИ</h1>
          <p>Футбольная аркада 1v1 · войдите или создайте аккаунт</p>
        </div>

        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab auth-tab--active" data-auth-tab="login" role="tab">Вход</button>
          <button type="button" class="auth-tab" data-auth-tab="register" role="tab">Регистрация</button>
        </div>

        <form data-auth-form="login" class="auth-panel" data-auth-panel="login">
          <div class="auth-field">
            <label for="auth-login-user">Логин</label>
            <input id="auth-login-user" name="login" type="text" autocomplete="username" placeholder="Ник или имя" required maxlength="64">
          </div>
          <div class="auth-field">
            <label for="auth-login-pass">Пароль</label>
            <input id="auth-login-pass" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
          </div>
          <label class="auth-check">
            <input type="checkbox" name="changeNickname" data-auth-change-toggle>
            <span>Хочу сменить ник при входе</span>
          </label>
          <div class="auth-field" data-auth-change-field hidden>
            <label for="auth-login-newnick">Новый ник</label>
            <input id="auth-login-newnick" name="newNickname" type="text" autocomplete="nickname" placeholder="Новый ник" maxlength="32">
          </div>
          <p class="auth-error" data-auth-error-login role="alert"></p>
          <button type="submit" class="auth-submit">Войти в игру</button>
        </form>

        <form data-auth-form="register" class="auth-panel" data-auth-panel="register" hidden>
          <div class="auth-field">
            <label for="auth-reg-user">Логин (ник в игре)</label>
            <input id="auth-reg-user" name="username" type="text" autocomplete="username" placeholder="Например, Артём_7" required maxlength="32">
          </div>
          <div class="auth-field">
            <label for="auth-reg-mail">Email <span style="opacity:0.6;font-weight:400;">(необязательно)</span></label>
            <input id="auth-reg-mail" name="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="120">
          </div>
          <div class="auth-field">
            <label for="auth-reg-pass">Пароль</label>
            <input id="auth-reg-pass" name="password" type="password" autocomplete="new-password" placeholder="Минимум 4 символа" required minlength="4">
          </div>
          <div class="auth-field">
            <label for="auth-reg-pass2">Повтор пароля</label>
            <input id="auth-reg-pass2" name="password2" type="password" autocomplete="new-password" placeholder="Ещё раз" required>
          </div>
          <p class="auth-error" data-auth-error-register role="alert"></p>
          <button type="submit" class="auth-submit">Создать аккаунт</button>
        </form>

        <p class="auth-footnote">Данные хранятся только в этом браузере. Это демо-авторизация без сервера.</p>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
